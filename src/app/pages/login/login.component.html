<main class="login-page">
  <section class="login-card" [class.is-transitioning]="loading" aria-labelledby="login-title">
    <header class="login-brand">
      <img class="login-logo" src="assets/ih2h-logo.png" alt="Israel Heart 2 Heart">
      <div>
        <h1 id="login-title">Mentor Program</h1>
        <p>Israel Heart 2 Heart</p>
      </div>
    </header>

    <p class="login-intro">Sign in to view your mentor matches</p>

    <form (ngSubmit)="login()" [attr.aria-busy]="loading">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button class="sign-in-button" type="submit" [class.is-loading]="loading" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    @if (errorMessage) {
      <p class="error" role="alert">{{ errorMessage }}</p>
    }
  </section>

  <div class="auth-transition-overlay" [class.is-hidden]="!loading" role="status" [attr.aria-hidden]="!loading">
    <div>
      <img class="auth-transition-logo" src="assets/ih2h-logo.png" alt="">
      <strong>Signing you in…</strong>
    </div>
  </div>
</main>
